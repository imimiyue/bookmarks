<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>書籤</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--panel:#fff;--text:#20242b;--muted:#7b818b;--line:#e8eaee;--accent:#4778e8;--hover:#f0f3f8;--shadow:0 2px 12px #17203308}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--panel:#191c22;--text:#edf0f5;--muted:#9ba2ad;--line:#2a2e37;--accent:#83a8ff;--hover:#242832;--shadow:none}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft JhengHei","Noto Sans CJK TC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:20px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line)}.brand{font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;font-weight:750;font-size:20px;letter-spacing:-.045em;white-space:nowrap}.search-wrap{position:relative;flex:1;max-width:760px;margin:0 auto}.search{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text);outline:none}.search:focus{border-color:var(--accent)}.search-icon{position:absolute;left:13px;top:9px;color:var(--muted);font-size:17px}
.layout{display:grid;grid-template-columns:170px minmax(0,1fr);gap:24px;max-width:1500px;margin:0 auto;padding:20px 24px}.layout.alpha-mode{grid-template-columns:42px minmax(0,1fr)}.sidebar{align-self:start;position:sticky;top:82px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px;scrollbar-width:thin}.mode-toggle{display:block;width:100%;border:1px solid var(--line);background:var(--panel);padding:8px 10px;border-radius:9px;text-align:left;margin-bottom:15px;font-weight:600}.mode-toggle:hover{background:var(--hover)}.side-title{color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:8px 8px 5px}.nav-item{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:7px;padding:6px 8px;margin:1px 0;color:var(--muted);overflow-wrap:anywhere}.nav-item:hover,.folder-label:hover{background:var(--hover);color:var(--text)}.nav-item.active,.folder-label.active{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}.folder-tree{font-size:13px}.folder-node{min-width:0}.folder-row{display:flex;align-items:center;gap:2px;min-width:0}.folder-expander{flex:0 0 19px;width:19px;height:28px;border:0;border-radius:5px;background:transparent;color:var(--muted);padding:0;display:grid;place-items:center}.folder-expander:hover{background:var(--hover)}.folder-expander.empty{visibility:hidden}.folder-label{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);text-align:left;padding:5px 6px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.folder-children{padding-left:12px}.layout.alpha-mode .sidebar{padding-right:0;overflow:visible}.layout.alpha-mode .mode-toggle{font-size:10px;text-align:center;padding:7px 2px;overflow-wrap:anywhere}.alpha-rail{display:flex;flex-direction:column;align-items:center;gap:2px;max-height:calc(100vh - 160px);overflow:auto;scrollbar-width:none}.alpha-rail::-webkit-scrollbar{display:none}.alpha-link{width:25px;height:22px;display:grid;place-items:center;border-radius:5px;font-size:11px;color:var(--muted)}.alpha-link:hover,.alpha-link.active{background:var(--accent);color:white}.main{min-width:0}.page-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 18px}.page-heading h1{font-size:22px;margin:0;font-weight:700}.hint{color:var(--muted);font-size:12px}.section{scroll-margin-top:90px;margin:0 0 30px}.section-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:650;margin:0 0 12px}.section-title:after{content:"";height:1px;background:var(--line);flex:1}.bookmark-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.bookmark{display:flex;align-items:center;gap:11px;min-width:0;padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:12px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}.bookmark:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}.favicon{width:32px;height:32px;flex:0 0 32px;border-radius:9px;background:var(--hover);display:grid;place-items:center;overflow:hidden;font-size:14px;font-weight:650;color:var(--muted)}.favicon img{width:100%;height:100%;object-fit:cover}.bookmark-copy{min-width:0}.bookmark-name{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bookmark-url{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}.tag-list{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px}.tag-chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;color:var(--muted)}.tag-chip.active,.tag-chip:hover{color:var(--accent);border-color:var(--accent)}.empty{padding:40px 12px;text-align:center;color:var(--muted)}
@media(max-width:700px){.topbar{padding:10px 12px;gap:12px}.brand{font-size:18px}.search{padding:9px 10px 9px 32px}.search-icon{left:10px;top:7px}.layout,.layout.alpha-mode{grid-template-columns:132px minmax(0,1fr);gap:12px;padding:14px 10px}.layout.alpha-mode{grid-template-columns:35px minmax(0,1fr)}.sidebar{top:70px;max-height:calc(100vh - 82px)}.page-heading h1{font-size:19px}.bookmark-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}.bookmark{padding:10px;gap:8px}.favicon{width:28px;height:28px;flex-basis:28px}.layout.alpha-mode .mode-toggle{font-size:9px}.alpha-link{width:22px}}
</style>
</head>
<body>
<header class="topbar"><div class="brand">書籤</div><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="search" type="search" placeholder="搜索网站名称或网址…" autocomplete="off"></div></header>
<div id="layout" class="layout"><aside id="sidebar" class="sidebar"></aside><main class="main"><div class="page-heading"><h1 id="pageTitle">全部书签</h1><span id="resultHint" class="hint"></span></div><div id="content"><div class="empty">正在加载书签…</div></div></main></div>
<script>
const DATA_URL='./bookmarks.json';
const ALPHABET='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let bookmarks=[],mode='tags',selectedTag='',selectedFolder='';
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getTags(b){let v=b.tags??b.tag??[];if(typeof v==='string')v=[v];return Array.isArray(v)?v.filter(Boolean).map(String):[]}
function getFolders(b){let v=b.folders??b.folder??[];if(typeof v==='string')v=v.split('/').map(s=>s.trim()).filter(Boolean);if(!Array.isArray(v))return [];return v.filter(Boolean).flatMap(x=>String(x).split('/').map(s=>s.trim()).filter(Boolean))}
function siteHost(url){try{return new URL(url).hostname.replace(/^www\./,'')}catch{return String(url||'')}}
function firstLetter(b){const s=(b.name||siteHost(b.url)||'').trim();if(!s)return '#';const c=s[0].toUpperCase();if(/[A-Z]/.test(c))return c;const pinyin={'北':'B','百':'B','哔':'B','谷':'G','微':'W','知':'Z','搜':'S','图':'T','影':'Y','动':'D','番':'F','虎':'H','豆':'D','开':'K','网':'W','学':'X','阅':'Y','书':'S','音':'Y','视':'S','爱':'A','优':'Y','腾':'T','京':'J','淘':'T','新':'X'};return pinyin[c]||'#'}
function folderPath(b){return getFolders(b).join(' / ')||'未分类'}
function matchesSearch(b,q){return !q||(String(b.name||'').toLowerCase().includes(q)||String(b.url||'').toLowerCase().includes(q)||getTags(b).join(' ').toLowerCase().includes(q)||folderPath(b).toLowerCase().includes(q))}
function faviconHTML(b){const host=siteHost(b.url);if(!host)return '<span>↗</span>';const src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(host)+'&sz=64';return `<img src="${src}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('↗'))">`}
function card(b){const url=String(b.url||'#');return `<a class="bookmark" href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer" title="${escapeHTML(b.name||url)}"><span class="favicon">${faviconHTML(b)}</span><span class="bookmark-copy"><span class="bookmark-name">${escapeHTML(b.name||siteHost(url))}</span><span class="bookmark-url">${escapeHTML(siteHost(url))}</span></span></a>`}
function grouped(items,keyFn){const map=new Map();for(const b of items){const k=keyFn(b);if(!map.has(k))map.set(k,[]);map.get(k).push(b)}return map}
function makeFolderTree(){const root={name:'',path:'',children:new Map()};for(const b of bookmarks){const fs=getFolders(b);if(!fs.length)continue;let node=root;const path=[];for(const name of fs){path.push(name);if(!node.children.has(name))node.children.set(name,{name,path:path.join(' / '),children:new Map()});node=node.children.get(name)}}return root}
function folderNodeHTML(node){const children=[...node.children.values()].sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));const hasChildren=children.length>0;return `<div class="folder-node" data-node-path="${escapeHTML(node.path)}"><div class="folder-row"><button class="folder-expander ${hasChildren?'':'empty'}" type="button" aria-label="展开或折叠">${hasChildren?'▸':''}</button><button class="folder-label ${selectedFolder===node.path?'active':''}" type="button" data-folder="${escapeHTML(node.path)}" title="${escapeHTML(node.path)}">${escapeHTML(node.name)}</button></div>${hasChildren?`<div class="folder-children" hidden>${children.map(folderNodeHTML).join('')}</div>`:''}</div>`}
function renderSidebar(){const side=$('sidebar');$('layout').classList.toggle('alpha-mode',mode==='alpha');if(mode==='alpha'){side.innerHTML=`<button id="modeToggle" class="mode-toggle" type="button" aria-label="切换到标签目录">标签</button><nav class="alpha-rail" aria-label="字母索引">${[...ALPHABET,'#'].map(l=>`<a class="alpha-link" href="#alpha-${l}" data-letter="${l}">${l}</a>`).join('')}</nav>`;side.querySelectorAll('.alpha-link').forEach(a=>a.addEventListener('click',()=>{side.querySelectorAll('.alpha-link').forEach(x=>x.classList.remove('active'));a.classList.add('active')}))}else{const tags=[...new Set(bookmarks.flatMap(getTags))].sort((a,b)=>a.localeCompare(b,'zh-CN'));const tree=makeFolderTree();const roots=[...tree.children.values()].sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));side.innerHTML=`<button id="modeToggle" class="mode-toggle" type="button" aria-label="切换到字母索引">字母</button><button class="nav-item ${!selectedTag&&!selectedFolder?'active':''}" data-clear="1">全部书签</button><div class="side-title">标签</div>${tags.map(t=>`<button class="nav-item ${selectedTag===t?'active':''}" data-tag="${escapeHTML(t)}">${escapeHTML(t)}</button>`).join('')}<div class="side-title">文件夹</div><div class="folder-tree">${roots.map(folderNodeHTML).join('')}</div>`;side.querySelectorAll('[data-tag]').forEach(el=>el.onclick=()=>{selectedTag=el.dataset.tag;selectedFolder='';render()});side.querySelectorAll('[data-folder]').forEach(el=>el.onclick=()=>{selectedFolder=el.dataset.folder;selectedTag='';render()});side.querySelector('[data-clear]')?.addEventListener('click',()=>{selectedTag='';selectedFolder='';render()});side.querySelectorAll('.folder-expander:not(.empty)').forEach(btn=>btn.addEventListener('click',()=>{const children=btn.closest('.folder-node').querySelector(':scope > .folder-children');const opening=children.hidden;children.hidden=!opening;btn.textContent=opening?'▾':'▸'}))} $('modeToggle').addEventListener('click',()=>{mode=mode==='alpha'?'tags':'alpha';selectedTag='';selectedFolder='';render()})}
function render(){const q=$('search').value.trim().toLowerCase();let items=bookmarks.filter(b=>matchesSearch(b,q));if(selectedTag)items=items.filter(b=>getTags(b).includes(selectedTag));if(selectedFolder)items=items.filter(b=>{const p=folderPath(b);return p===selectedFolder||p.startsWith(selectedFolder+' / ')});renderSidebar();$('resultHint').textContent='';const content=$('content');if(!items.length){$('pageTitle').textContent=q?'搜索结果':selectedTag||selectedFolder||'全部书签';content.innerHTML='<div class="empty">没有找到匹配的书签</div>';return}
if(mode==='alpha'){const groups=grouped(items,b=>firstLetter(b));const keys=[...groups.keys()].sort((a,b)=>a==='#'?1:b==='#'?-1:a.localeCompare(b));$('pageTitle').textContent=q?'搜索结果':'按字母浏览';content.innerHTML=`${keys.map(k=>`<section class="section" id="alpha-${k}"><h2 class="section-title">${escapeHTML(k)}</h2><div class="bookmark-grid">${groups.get(k).sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-CN')).map(card).join('')}</div></section>`).join('')}`}
else{const title=selectedTag||selectedFolder||(q?'搜索结果':'全部书签');$('pageTitle').textContent=title;const tagGroups=selectedTag||selectedFolder?null:grouped(items,b=>getTags(b)[0]||'未分类');if(tagGroups){const keys=[...tagGroups.keys()].sort((a,b)=>a.localeCompare(b,'zh-CN'));content.innerHTML=`<div class="tag-list">${[...new Set(bookmarks.flatMap(getTags))].sort((a,b)=>a.localeCompare(b,'zh-CN')).map(t=>`<button class="tag-chip ${selectedTag===t?'active':''}" data-tag="${escapeHTML(t)}">${escapeHTML(t)}</button>`).join('')}</div>${keys.map(k=>`<section class="section"><h2 class="section-title">${escapeHTML(k)}</h2><div class="bookmark-grid">${tagGroups.get(k).sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-CN')).map(card).join('')}</div></section>`).join('')}`;content.querySelectorAll('[data-tag]').forEach(el=>el.onclick=()=>{selectedTag=el.dataset.tag;selectedFolder='';render()})}else{content.innerHTML=`<div class="bookmark-grid">${items.sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-CN')).map(card).join('')}</div>`}}
}
$('search').addEventListener('input',render);
fetch(DATA_URL).then(r=>{if(!r.ok)throw new Error('无法读取 bookmarks.json');return r.json()}).then(data=>{bookmarks=Array.isArray(data)?data:(Array.isArray(data.bookmarks)?data.bookmarks:[]);bookmarks=bookmarks.filter(b=>b&&b.url);render()}).catch(err=>{$('content').innerHTML='<div class="empty">无法加载 bookmarks.json。请确认它与 index.html 位于同一目录，且 JSON 格式正确。</div>';console.error(err)});
</script>
</body>
</html>
