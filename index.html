<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的书签</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--panel:#fff;--text:#20242b;--muted:#7b818b;--line:#e8eaee;--accent:#4778e8;--hover:#f0f3f8;--shadow:0 2px 12px #17203308}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--panel:#191c22;--text:#edf0f5;--muted:#9ba2ad;--line:#2a2e37;--accent:#83a8ff;--hover:#242832;--shadow:none}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
button,input{font:inherit}button{color:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:17px;white-space:nowrap}.search-wrap{position:relative;flex:1;max-width:760px;margin:0 auto}.search{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text);outline:none}.search:focus{border-color:var(--accent)}.search-icon{position:absolute;left:13px;top:9px;color:var(--muted);font-size:17px}.mode-toggle{border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:9px;white-space:nowrap}.mode-toggle:hover{background:var(--hover)}
.layout{display:grid;grid-template-columns:164px minmax(0,1fr);gap:24px;max-width:1500px;margin:0 auto;padding:22px 24px}.sidebar{align-self:start;position:sticky;top:82px;max-height:calc(100vh - 100px);overflow:auto;padding-right:5px}.side-title{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:0 10px 8px}.nav-item{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 10px;margin:1px 0;color:var(--muted);overflow-wrap:anywhere}.nav-item:hover{background:var(--hover);color:var(--text)}.nav-item.active{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}.subnav{padding-left:12px}.main{min-width:0}.page-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 18px}.page-heading h1{font-size:22px;margin:0;font-weight:700}.hint{color:var(--muted);font-size:12px}
.section{scroll-margin-top:90px;margin:0 0 30px}.section-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:650;margin:0 0 12px}.section-title:after{content:"";height:1px;background:var(--line);flex:1}.bookmark-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.bookmark{display:flex;align-items:center;gap:11px;min-width:0;padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:12px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}.bookmark:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}.favicon{width:32px;height:32px;flex:0 0 32px;border-radius:9px;background:var(--hover);display:grid;place-items:center;overflow:hidden;font-size:14px;font-weight:650;color:var(--muted)}.favicon img{width:100%;height:100%;object-fit:cover}.bookmark-copy{min-width:0}.bookmark-name{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bookmark-url{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}.tag-list{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px}.tag-chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;color:var(--muted)}.tag-chip.active,.tag-chip:hover{color:var(--accent);border-color:var(--accent)}
.alpha-layout{display:grid;grid-template-columns:26px minmax(0,1fr);gap:18px}.alpha-rail{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;align-items:center;gap:2px;max-height:calc(100vh - 112px);overflow:auto;scrollbar-width:none}.alpha-rail::-webkit-scrollbar{display:none}.alpha-link{width:23px;height:22px;display:grid;place-items:center;border-radius:5px;font-size:11px;color:var(--muted)}.alpha-link:hover,.alpha-link.active{background:var(--accent);color:white}.empty{padding:40px 12px;text-align:center;color:var(--muted)}.mobile-nav{display:none}
@media(max-width:700px){.topbar{padding:10px 12px;gap:8px}.brand{font-size:15px}.search{padding:9px 10px 9px 32px}.search-icon{left:10px;top:7px}.mode-toggle{padding:8px 10px}.layout{display:block;padding:16px 12px}.sidebar{display:none}.page-heading h1{font-size:19px}.bookmark-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}.bookmark{padding:10px;gap:8px}.favicon{width:28px;height:28px;flex-basis:28px}.alpha-layout{grid-template-columns:22px minmax(0,1fr);gap:10px}.alpha-link{width:20px}.mobile-nav{display:flex;gap:7px;overflow:auto;padding:0 12px 10px;background:var(--panel);border-bottom:1px solid var(--line)}.mobile-nav button{white-space:nowrap;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;color:var(--muted)}}
</style>
</head>
<body>
<header class="topbar"><div class="brand">我的书签</div><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="search" type="search" placeholder="搜索网站名称或网址…" autocomplete="off"></div><button id="modeToggle" class="mode-toggle" type="button">字母</button></header>
<nav id="mobileNav" class="mobile-nav" hidden></nav>
<div class="layout"><aside id="sidebar" class="sidebar"></aside><main class="main"><div class="page-heading"><h1 id="pageTitle">全部书签</h1><span id="resultHint" class="hint"></span></div><div id="content"><div class="empty">正在加载书签…</div></div></main></div>
<script>
const DATA_URL='./bookmarks.json';
const ALPHABET='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let bookmarks=[], mode='tags', selectedTag='', selectedFolder='';
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getTags(b){let v=b.tags??b.tag??[];if(typeof v==='string')v=[v];return Array.isArray(v)?v.filter(Boolean).map(String):[]}
function getFolders(b){let v=b.folders??b.folder??[];if(typeof v==='string')v=v.split('/').map(s=>s.trim()).filter(Boolean);if(!Array.isArray(v))return [];return v.filter(Boolean).map(String).slice(0,3)}
function siteHost(url){try{return new URL(url).hostname.replace(/^www\./,'')}catch{return String(url||'')}}
function firstLetter(b){const s=(b.name||siteHost(b.url)||'').trim();if(!s)return '#';const c=s[0].toUpperCase();if(/[A-Z]/.test(c))return c;const pinyin={'北':'B','百':'B','哔':'B','谷':'G','微':'W','知':'Z','搜':'S','图':'T','影':'Y','动':'D','番':'F','虎':'H','豆':'D','开':'K','网':'W','学':'X','阅':'Y','书':'S','音':'Y','视':'S','爱':'A','优':'Y','腾':'T','京':'J','淘':'T','新':'X'};return pinyin[c]||'#'}
function folderPath(b){return getFolders(b).join(' / ')||'未分类'}
function matchesSearch(b,q){return !q||(String(b.name||'').toLowerCase().includes(q)||String(b.url||'').toLowerCase().includes(q)||getTags(b).join(' ').toLowerCase().includes(q)||folderPath(b).toLowerCase().includes(q))}
function faviconHTML(b){const host=siteHost(b.url);if(!host)return '<span>↗</span>';const src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(host)+'&sz=64';return `<img src="${src}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('↗'))">`}
function card(b){const url=String(b.url||'#');return `<a class="bookmark" href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer" title="${escapeHTML(b.name||url)}"><span class="favicon">${faviconHTML(b)}</span><span class="bookmark-copy"><span class="bookmark-name">${escapeHTML(b.name||siteHost(url))}</span><span class="bookmark-url">${escapeHTML(siteHost(url))}</span></span></a>`}
function grouped(items,keyFn){const map=new Map();for(const b of items){const k=keyFn(b);if(!map.has(k))map.set(k,[]);map.get(k).push(b)}return map}
function renderSidebar(items){const side=$('sidebar');if(mode==='alpha'){side.innerHTML='';return}const tags=[...new Set(bookmarks.flatMap(getTags))].sort((a,b)=>a.localeCompare(b,'zh-CN'));const folderSet=new Set();bookmarks.forEach(b=>{const fs=getFolders(b);for(let i=1;i<=fs.length;i++)folderSet.add(fs.slice(0,i).join(' / '))});const folders=[...folderSet].sort((a,b)=>a.localeCompare(b,'zh-CN'));side.innerHTML=`<div class="side-title">标签</div><button class="nav-item ${!selectedTag&&!selectedFolder?'active':''}" data-clear="1">全部书签</button>${tags.map(t=>`<button class="nav-item ${selectedTag===t?'active':''}" data-tag="${escapeHTML(t)}">${escapeHTML(t)}</button>`).join('')}<div class="side-title" style="margin-top:18px">文件夹</div>${folders.map(f=>`<button class="nav-item ${selectedFolder===f?'active':''}" data-folder="${escapeHTML(f)}" title="${escapeHTML(f)}">${escapeHTML(f.split(' / ').slice(-1)[0])}</button>`).join('')}`;side.querySelectorAll('[data-tag]').forEach(el=>el.onclick=()=>{selectedTag=el.dataset.tag;selectedFolder='';render()});side.querySelectorAll('[data-folder]').forEach(el=>el.onclick=()=>{selectedFolder=el.dataset.folder;selectedTag='';render()});side.querySelector('[data-clear]')?.addEventListener('click',()=>{selectedTag='';selectedFolder='';render()})}
function renderMobileNav(){const nav=$('mobileNav');if(mode!=='tags'||window.innerWidth>700){nav.hidden=true;nav.innerHTML='';return}const tags=[...new Set(bookmarks.flatMap(getTags))].sort((a,b)=>a.localeCompare(b,'zh-CN'));nav.hidden=false;nav.innerHTML=`<button data-all="1">全部</button>${tags.map(t=>`<button data-tag="${escapeHTML(t)}">${escapeHTML(t)}</button>`).join('')}`;nav.querySelector('[data-all]').onclick=()=>{selectedTag='';selectedFolder='';render()};nav.querySelectorAll('[data-tag]').forEach(el=>el.onclick=()=>{selectedTag=el.dataset.tag;selectedFolder='';render()})}
function render(){const q=$('search').value.trim().toLowerCase();let items=bookmarks.filter(b=>matchesSearch(b,q));if(selectedTag)items=items.filter(b=>getTags(b).includes(selectedTag));if(selectedFolder)items=items.filter(b=>{const p=folderPath(b);return p===selectedFolder||p.startsWith(selectedFolder+' / ')});renderSidebar(items);renderMobileNav();$('modeToggle').textContent=mode==='alpha'?'标签':'字母';$('resultHint').textContent='';const content=$('content');if(!items.length){$('pageTitle').textContent=q?'搜索结果':selectedTag||selectedFolder||'全部书签';$('resultHint').textContent='';content.innerHTML='<div class="empty">没有找到匹配的书签</div>';return}
if(mode==='alpha'){const groups=grouped(items,b=>firstLetter(b));const keys=[...groups.keys()].sort((a,b)=>a==='#'?1:b==='#'?-1:a.localeCompare(b));$('pageTitle').textContent=q?'搜索结果':'按字母浏览';content.innerHTML=`<div class="alpha-layout"><nav class="alpha-rail" aria-label="字母索引">${[...ALPHABET,'#'].map(l=>`<a class="alpha-link" href="#alpha-${l}" data-letter="${l}">${l}</a>`).join('')}</nav><div>${keys.map(k=>`<section class="section" id="alpha-${k}"><h2 class="section-title">${escapeHTML(k)}</h2><div class="bookmark-grid">${groups.get(k).sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-CN')).map(card).join('')}</div></section>`).join('')}</div></div>`;content.querySelectorAll('.alpha-link').forEach(a=>a.addEventListener('click',()=>{content.querySelectorAll('.alpha-link').forEach(x=>x.classList.remove('active'));a.classList.add('active')}))
}else{const title=selectedTag||selectedFolder||(q?'搜索结果':'全部书签');$('pageTitle').textContent=title;const tagGroups=selectedTag||selectedFolder?null:grouped(items,b=>getTags(b)[0]||'未分类');if(tagGroups){const keys=[...tagGroups.keys()].sort((a,b)=>a.localeCompare(b,'zh-CN'));content.innerHTML=`<div class="tag-list">${[...new Set(bookmarks.flatMap(getTags))].sort((a,b)=>a.localeCompare(b,'zh-CN')).map(t=>`<button class="tag-chip" data-tag="${escapeHTML(t)}">${escapeHTML(t)}</button>`).join('')}</div>${keys.map(k=>`<section class="section"><h2 class="section-title">${escapeHTML(k)}</h2><div class="bookmark-grid">${tagGroups.get(k).sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-CN')).map(card).join('')}</div></section>`).join('')}`;content.querySelectorAll('[data-tag]').forEach(el=>el.onclick=()=>{selectedTag=el.dataset.tag;selectedFolder='';render()})}else{content.innerHTML=`<div class="bookmark-grid">${items.sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-CN')).map(card).join('')}</div>`}}
}
$('modeToggle').addEventListener('click',()=>{mode=mode==='alpha'?'tags':'alpha';selectedTag='';selectedFolder='';render()});$('search').addEventListener('input',render);window.addEventListener('resize',renderMobileNav);
fetch(DATA_URL).then(r=>{if(!r.ok)throw new Error('无法读取 bookmarks.json');return r.json()}).then(data=>{bookmarks=Array.isArray(data)?data:(Array.isArray(data.bookmarks)?data.bookmarks:[]);bookmarks=bookmarks.filter(b=>b&&b.url);render()}).catch(err=>{$('content').innerHTML='<div class="empty">无法加载 bookmarks.json。请确认它与 index.html 位于同一目录，且 JSON 格式正确。</div>';console.error(err)});
</script>
</body>
</html>
