<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>我的书签</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-soft: #f0f2f5;
      --text: #20242b;
      --muted: #707783;
      --border: #e1e5eb;
      --accent: #356ae6;
      --shadow: 0 8px 28px rgba(25, 35, 55, .06);
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --panel: #191c23;
        --panel-soft: #222630;
        --text: #edf0f6;
        --muted: #a0a8b6;
        --border: #303541;
        --accent: #8aaaff;
        --shadow: 0 8px 28px rgba(0, 0, 0, .18);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 88px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
            "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 218px;
      overflow-y: auto;
      padding: 22px 14px 28px;
      background: var(--panel);
      border-right: 1px solid var(--border);
    }
    .brand { padding: 0 10px 18px; }
    .brand-title { font-size: 19px; font-weight: 750; letter-spacing: -.03em; }
    .brand-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .nav-label {
      color: var(--muted); font-size: 11px; font-weight: 750;
      letter-spacing: .08em; padding: 16px 10px 7px; text-transform: uppercase;
    }
    .nav-list { display: grid; gap: 3px; }
    .nav-button {
      display: flex; align-items: center; gap: 9px; width: 100%;
      border: 0; border-radius: 10px; background: transparent;
      padding: 8px 10px; text-align: left; cursor: pointer;
    }
    .nav-button:hover, .nav-button.active { background: var(--panel-soft); }
    .nav-button.active { font-weight: 700; }
    .nav-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .main { margin-left: 218px; min-width: 0; }
    .topbar {
      position: sticky; top: 0; z-index: 5; display: flex; align-items: center;
      gap: 14px; padding: 17px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(16px); border-bottom: 1px solid color-mix(in srgb, var(--border) 75%, transparent);
    }
    .search-wrap { position: relative; flex: 1; min-width: 120px; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    #search {
      width: 100%; height: 44px; border: 1px solid var(--border); border-radius: 13px;
      outline: none; padding: 0 14px 0 42px; background: var(--panel); color: var(--text);
    }
    #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
    .mode-switch { display: flex; gap: 3px; padding: 4px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); }
    .mode-btn { border: 0; border-radius: 8px; padding: 7px 11px; cursor: pointer; background: transparent; color: var(--muted); white-space: nowrap; }
    .mode-btn.active { background: var(--panel-soft); color: var(--text); font-weight: 700; }
    .content { max-width: 1440px; padding: 28px; margin: 0 auto; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 23px; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 32px); line-height: 1.2; letter-spacing: -.04em; overflow-wrap: anywhere; }
    .subtitle { color: var(--muted); margin-top: 8px; font-size: 13px; }
    .stats { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .breadcrumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin: -8px 0 20px; color: var(--muted); font-size: 13px; }
    .crumb { border: 0; background: transparent; padding: 2px 0; color: var(--accent); cursor: pointer; }
    .crumb-sep { color: var(--muted); }
    .section-title { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 750; margin: 25px 0 12px; }
    .section-title:first-child { margin-top: 0; }
    .section-count { color: var(--muted); font-size: 12px; font-weight: 500; }
    .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 11px; margin-bottom: 23px; }
    .folder-card {
      display: flex; align-items: center; gap: 12px; min-width: 0; padding: 15px;
      border: 1px solid var(--border); border-radius: 14px; background: var(--panel);
      text-align: left; cursor: pointer; transition: transform .15s, border-color .15s;
    }
    .folder-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
    .folder-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--panel-soft); font-size: 19px; flex: 0 0 auto; }
    .folder-info { min-width: 0; flex: 1; }
    .folder-name { font-weight: 700; overflow-wrap: anywhere; }
    .folder-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .bookmark-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 11px; }
    .bookmark-card {
      display: flex; gap: 12px; min-width: 0; padding: 14px;
      border: 1px solid var(--border); border-radius: 14px; background: var(--panel);
      color: inherit; text-decoration: none; transition: transform .15s, border-color .15s;
    }
    .bookmark-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
    .site-icon {
      display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 auto;
      border: 1px solid var(--border); border-radius: 11px; background: var(--panel-soft);
      font-size: 17px; font-weight: 750; text-transform: uppercase;
    }
    .bookmark-info { min-width: 0; flex: 1; }
    .bookmark-name { font-weight: 700; overflow-wrap: anywhere; line-height: 1.4; }
    .bookmark-url { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; margin-top: 4px; }
    .bookmark-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .tag-pill { font-size: 11px; padding: 2px 7px; border-radius: 6px; font-weight: 650; }
    .empty { padding: 48px 18px; text-align: center; border: 1px dashed var(--border); border-radius: var(--radius); color: var(--muted); }
    .error { padding: 20px; border: 1px solid #d86a6a; border-radius: 14px; background: var(--panel); }
    .alpha-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 23px; }
    .alpha-link { display: inline-grid; place-items: center; min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel); color: var(--text); text-decoration: none; font-size: 12px; font-weight: 700; }
    .alpha-link:hover { border-color: var(--accent); color: var(--accent); }
    .alpha-section { scroll-margin-top: 90px; margin-bottom: 28px; }
    .loading { color: var(--muted); padding: 40px 0; }
    .mobile-nav { display: none; }
    @media (max-width: 760px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
      .topbar { display: block; padding: 12px 14px; }
      .mode-switch { margin-top: 9px; width: fit-content; }
      .mobile-nav { display: flex; gap: 7px; overflow-x: auto; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border); scrollbar-width: thin; }
      .mobile-nav .nav-button { width: auto; flex: 0 0 auto; padding: 7px 10px; border: 1px solid var(--border); }
      .content { padding: 22px 14px; }
      .page-head { align-items: flex-start; flex-direction: column; gap: 7px; }
      .folder-grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); }
      .bookmark-grid { grid-template-columns: 1fr; }
      .stats { white-space: normal; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">我的书签</div>
        <div class="brand-sub">个人收藏 · 快速检索</div>
      </div>
      <div class="nav-label">浏览方式</div>
      <div class="nav-list">
        <button class="nav-button active" data-mode="folder"><span class="dot" style="background:var(--accent)"></span><span class="nav-name">按标签浏览</span></button>
        <button class="nav-button" data-mode="alpha"><span class="dot" style="background:#9b8afb"></span><span class="nav-name">按字母浏览</span></button>
      </div>
      <div class="nav-label">标签 / 文件夹</div>
      <nav id="sidebarTags" class="nav-list" aria-label="标签目录"></nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="搜索名称、关键词、域名或网址…" autocomplete="off" aria-label="搜索书签">
        </div>
        <div class="mode-switch" role="group" aria-label="浏览模式">
          <button class="mode-btn active" data-mode="folder">按标签</button>
          <button class="mode-btn" data-mode="alpha">按字母</button>
        </div>
      </header>
      <nav id="mobileNav" class="mobile-nav" aria-label="移动端标签目录"></nav>
      <div class="content">
        <div id="pageHead" class="page-head">
          <div><h1>全部书签</h1><div class="subtitle">正在读取书签数据…</div></div>
          <div class="stats"></div>
        </div>
        <div id="breadcrumbs" class="breadcrumbs" hidden></div>
        <div id="view"><div class="loading">正在读取 bookmarks.json…</div></div>
      </div>
    </main>
  </div>
<script>
(() => {
  "use strict";

  const DATA_URL = "./bookmarks.json";
  const INITIAL_TAG_ORDER = ["pku", "tool", "acg", "image", "video", "anime", "search", "navi"];
  const PALETTE = [
    { bg: "#dceafe", fg: "#194b91", dot: "#3979d8" },
    { bg: "#d9f4e8", fg: "#176647", dot: "#2b9b70" },
    { bg: "#fbe5d5", fg: "#8a4317", dot: "#d77b37" },
    { bg: "#eee3ff", fg: "#6536a0", dot: "#9562d8" },
    { bg: "#f9dfeb", fg: "#922c5c", dot: "#ce578a" },
    { bg: "#e4edc9", fg: "#4c641d", dot: "#83a63d" },
    { bg: "#d6f0f4", fg: "#155d6a", dot: "#3d9eae" },
    { bg: "#f5e9bd", fg: "#725710", dot: "#c5a13a" },
    { bg: "#e3e3e8", fg: "#454653", dot: "#777987" },
    { bg: "#f3dedb", fg: "#853a32", dot: "#c56d62" },
    { bg: "#dce5ff", fg: "#344b9a", dot: "#687fe0" },
    { bg: "#d9eee0", fg: "#2d6640", dot: "#65a678" }
  ];

  const state = {
    all: [], filtered: [], mode: "folder", query: "",
    activeTag: null, folderPath: [], loaded: false, error: null
  };

  const $ = (selector) => document.querySelector(selector);
  const view = $("#view");
  const searchInput = $("#search");
  const collator = new Intl.Collator("zh-CN-u-co-pinyin", { numeric: true, sensitivity: "base" });

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
  }
  function normalize(value) { return String(value ?? "").normalize("NFKC").toLocaleLowerCase(); }
  function stableHash(str) {
    let hash = 2166136261;
    for (const char of str) {
      hash ^= char.codePointAt(0);
      hash = Math.imul(hash, 16777619);
    }
    return hash >>> 0;
  }
  function colorFor(tag) { return PALETTE[stableHash(tag) % PALETTE.length]; }
  function sortNames(a, b) { return collator.compare(a, b); }
  function canonicalUrl(url) {
    try {
      const parsed = new URL(url);
      parsed.hash = "";
      return parsed.href.replace(/\/$/, "");
    } catch { return String(url ?? "").trim(); }
  }
  function getFolders(bookmark) {
    if (Array.isArray(bookmark.folders)) return bookmark.folders.map(String).filter(Boolean).slice(0, 3);
    if (typeof bookmark.folder === "string" && bookmark.folder) return bookmark.folder.split("/").filter(Boolean).slice(0, 3);
    if (typeof bookmark.tag === "string" && bookmark.tag) return [bookmark.tag];
    return ["未分类"];
  }
  function normalizeBookmark(item, index) {
    const name = String(item.name ?? item.title ?? item.url ?? `未命名书签 ${index + 1}`).trim();
    const url = String(item.url ?? item.href ?? "").trim();
    const folders = getFolders(item);
    return { name, url, folders, id: `${canonicalUrl(url)}|${folders.join("/")}|${index}` };
  }
  function uniqueUrlCount(items) {
    return new Set(items.map(item => canonicalUrl(item.url)).filter(Boolean)).size;
  }
  function countInFolder(items, folderPath) {
    return items.filter(item => folderPath.every((part, i) => item.folders[i] === part)).length;
  }
  function folderChildren(items, path) {
    const depth = path.length;
    const names = new Set();
    for (const item of items) {
      if (path.every((part, i) => item.folders[i] === part) && item.folders.length > depth) {
        names.add(item.folders[depth]);
      }
    }
    return [...names].sort(sortNames).map(name => ({
      name,
      path: [...path, name],
      count: countInFolder(items, [...path, name])
    }));
  }
  function sortTopTags(tags) {
    return tags.sort((a, b) => sortNames(a.name, b.name));
  }
  function allTopTags(items) {
    const names = new Set(items.map(item => item.folders[0] || "未分类"));
    return sortTopTags([...names].map(name => ({ name, count: countInFolder(items, [name]) })));
  }
  function getTagLabel(item) { return item.folders[0] || "未分类"; }
  function getDisplayUrl(url) {
    try { return new URL(url).hostname.replace(/^www\./, "") + (new URL(url).pathname !== "/" ? new URL(url).pathname : ""); }
    catch { return url; }
  }
  function getInitial(name) {
    const clean = String(name || "").trim();
    return clean ? Array.from(clean)[0] : "↗";
  }
  function tagPill(tag) {
    const color = colorFor(tag);
    return `<span class="tag-pill" style="background:${color.bg};color:${color.fg}">${escapeHtml(tag)}</span>`;
  }
  function bookmarkCard(item, showTag = false) {
    const name = escapeHtml(item.name);
    const url = escapeHtml(item.url);
    const displayUrl = escapeHtml(getDisplayUrl(item.url));
    const tags = showTag ? `<div class="bookmark-tags">${tagPill(getTagLabel(item))}</div>` : "";
    return `<a class="bookmark-card" href="${url}" target="_blank" rel="noopener noreferrer" title="${url}">
      <div class="site-icon">${escapeHtml(getInitial(item.name))}</div>
      <div class="bookmark-info"><div class="bookmark-name">${name}</div>
      <div class="bookmark-url">${displayUrl}</div>${tags}</div>
    </a>`;
  }
  function folderCard(folder) {
    const color = colorFor(folder.path[0] || folder.name);
    return `<button class="folder-card" data-open-folder="${escapeHtml(JSON.stringify(folder.path))}">
      <span class="folder-icon" style="color:${color.dot}">▰</span>
      <span class="folder-info"><span class="folder-name">${escapeHtml(folder.name)}</span>
      <span class="folder-meta">${folder.count} 个书签</span></span>
    </button>`;
  }
  function setHeading(title, description, countText) {
    $("#pageHead").innerHTML = `<div><h1>${escapeHtml(title)}</h1><div class="subtitle">${escapeHtml(description)}</div></div><div class="stats">${escapeHtml(countText)}</div>`;
  }
  function renderBreadcrumbs() {
    const el = $("#breadcrumbs");
    if (state.mode !== "folder" || !state.activeTag) {
      el.hidden = true; el.innerHTML = ""; return;
    }
    el.hidden = false;
    const parts = [state.activeTag, ...state.folderPath];
    let html = `<button class="crumb" data-crumb="-1">${escapeHtml(state.activeTag)}</button>`;
    state.folderPath.forEach((part, index) => {
      html += `<span class="crumb-sep">/</span><button class="crumb" data-crumb="${index}">${escapeHtml(part)}</button>`;
    });
    el.innerHTML = html;
  }
  function renderNav() {
    const tags = allTopTags(state.all);
    const markup = tags.map(tag => {
      const color = colorFor(tag.name);
      const active = state.activeTag === tag.name && state.mode === "folder";
      return `<button class="nav-button ${active ? "active" : ""}" data-tag="${escapeHtml(tag.name)}">
        <span class="dot" style="background:${color.dot}"></span><span class="nav-name">${escapeHtml(tag.name)}</span>
        <span class="nav-count">${tag.count}</span></button>`;
    }).join("");
    $("#sidebarTags").innerHTML = markup || `<div class="subtitle" style="padding:8px 10px">暂无标签</div>`;
    $("#mobileNav").innerHTML = tags.map(tag => {
      const color = colorFor(tag.name);
      const active = state.activeTag === tag.name && state.mode === "folder";
      return `<button class="nav-button ${active ? "active" : ""}" data-tag="${escapeHtml(tag.name)}">
        <span class="dot" style="background:${color.dot}"></span><span class="nav-name">${escapeHtml(tag.name)}</span><span class="nav-count">${tag.count}</span></button>`;
    }).join("");
  }
  function updateModeButtons() {
    document.querySelectorAll("[data-mode]").forEach(button => {
      button.classList.toggle("active", button.dataset.mode === state.mode);
    });
  }
  function renderFolderView() {
    const items = state.filtered;
    if (state.activeTag && !allTopTags(state.all).some(tag => tag.name === state.activeTag)) {
      state.activeTag = null; state.folderPath = [];
    }
    if (!state.activeTag) {
      const tags = allTopTags(items);
      setHeading(state.query ? "搜索结果" : "全部书签",
        state.query ? `匹配“${state.query}”的书签` : "按标签和文件夹整理的个人收藏",
        `${items.length} 条记录 · ${uniqueUrlCount(items)} 个唯一网址`);
      $("#breadcrumbs").hidden = true;
      const cards = tags.map(tag => folderCard({ name: tag.name, path: [tag.name], count: tag.count })).join("");
      view.innerHTML = cards ? `<div class="section-title">标签 <span class="section-count">${tags.length} 个</span></div><div class="folder-grid">${cards}</div>` : `<div class="empty">没有匹配的书签</div>`;
      return;
    }
    const path = [state.activeTag, ...state.folderPath];
    const currentItems = items.filter(item => path.every((part, i) => item.folders[i] === part));
    const children = folderChildren(items, path);
    const atRoot = state.folderPath.length === 0;
    setHeading(path[path.length - 1], atRoot ? `标签 ${state.activeTag}` : `文件夹：${path.join(" / ")}`,
      `${currentItems.length} 条记录 · ${uniqueUrlCount(currentItems)} 个唯一网址`);
    renderBreadcrumbs();
    const folderHtml = children.length ? `<div class="section-title">子文件夹 <span class="section-count">${children.length} 个</span></div><div class="folder-grid">${children.map(folderCard).join("")}</div>` : "";
    const matching = currentItems.filter(item => item.folders.length === path.length);
    const bookmarksHtml = matching.length ? `<div class="section-title">书签 <span class="section-count">${matching.length} 条</span></div><div class="bookmark-grid">${matching.map(item => bookmarkCard(item)).join("")}</div>` : "";
    view.innerHTML = folderHtml + bookmarksHtml || `<div class="empty">这个文件夹中没有匹配的书签</div>`;
  }
  let pinyinFn = null;
  async function loadPinyinSupport() {
    try {
      const module = await import("https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/+esm");
      pinyinFn = module.pinyin;
    } catch (error) {
      console.warn("拼音分组组件加载失败；中文名称将暂时归入 # 分组。", error);
    }
  }
  function alphaKey(name) {
    const first = Array.from(String(name || "").trim())[0] || "#";
    if (/[a-z]/i.test(first)) return first.toUpperCase();
    if (/\d/.test(first)) return "#";
    if (pinyinFn) {
      try {
        const result = pinyinFn(first, { toneType: "none" });
        const initial = String(result).trim().toUpperCase()[0];
        if (initial && /^[A-Z]$/.test(initial)) return initial;
      } catch {}
    }
    return "#";
  }
  function renderAlphaView() {
    const items = [...state.filtered].sort((a, b) => sortNames(a.name, b.name) || sortNames(a.url, b.url));
    const groups = new Map();
    for (const item of items) {
      const key = alphaKey(item.name);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(item);
    }
    const keys = [...groups.keys()].sort((a, b) => {
      if (a === "#") return 1; if (b === "#") return -1; return a.localeCompare(b);
    });
    setHeading(state.query ? "搜索结果" : "按字母浏览",
      state.query ? `匹配“${state.query}”的书签` : "按书签名称排序，点击字母快速跳转",
      `${items.length} 条记录 · ${uniqueUrlCount(items)} 个唯一网址`);
    $("#breadcrumbs").hidden = true;
    if (!items.length) { view.innerHTML = `<div class="empty">没有匹配的书签</div>`; return; }
    const nav = `<div class="alpha-nav">${keys.map(key => `<a class="alpha-link" href="#alpha-${encodeURIComponent(key)}">${escapeHtml(key)} <span>${groups.get(key).length}</span></a>`).join("")}</div>`;
    const sections = keys.map(key => `<section class="alpha-section" id="alpha-${encodeURIComponent(key)}">
      <div class="section-title">${escapeHtml(key)} <span class="section-count">${groups.get(key).length} 条</span></div>
      <div class="bookmark-grid">${groups.get(key).map(item => bookmarkCard(item, true)).join("")}</div>
    </section>`).join("");
    view.innerHTML = nav + sections;
  }
  function render() {
    if (!state.loaded) return;
    renderNav();
    updateModeButtons();
    if (state.mode === "folder") renderFolderView();
    else renderAlphaView();
  }
  function applySearch() {
    const query = normalize(state.query).trim();
    if (!query) state.filtered = [...state.all];
    else {
      const terms = query.split(/\s+/).filter(Boolean);
      state.filtered = state.all.filter(item => {
        const searchable = normalize([item.name, item.url, getDisplayUrl(item.url), ...item.folders].join(" "));
        return terms.every(term => searchable.includes(term));
      });
    }
    render();
  }
  async function loadData() {
    try {
      await loadPinyinSupport();
      const response = await fetch(DATA_URL, { cache: "no-cache" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      const rawItems = Array.isArray(data) ? data : data.bookmarks;
      if (!Array.isArray(rawItems)) throw new Error("JSON 顶层必须是数组，或包含 bookmarks 数组");
      state.all = rawItems.map(normalizeBookmark).filter(item => item.url);
      state.filtered = [...state.all];
      state.loaded = true;
      render();
    } catch (error) {
      console.error(error);
      $("#pageHead").innerHTML = `<div><h1>无法读取书签</h1><div class="subtitle">请检查 bookmarks.json 是否存在、格式是否正确。</div></div>`;
      view.innerHTML = `<div class="error"><strong>读取失败</strong><p>${escapeHtml(error.message)}</p><p>请确认 index.html 和 bookmarks.json 位于同一目录，并通过 GitHub Pages 或本地服务器打开网页。直接双击 index.html 可能会被浏览器限制读取 JSON。</p></div>`;
    }
  }

  document.addEventListener("click", event => {
    const modeButton = event.target.closest("[data-mode]");
    if (modeButton) {
      state.mode = modeButton.dataset.mode;
      if (state.mode === "alpha") { state.activeTag = null; state.folderPath = []; }
      applySearch();
      return;
    }
    const tagButton = event.target.closest("[data-tag]");
    if (tagButton) {
      state.mode = "folder";
      state.activeTag = tagButton.dataset.tag;
      state.folderPath = [];
      applySearch();
      return;
    }
    const folderButton = event.target.closest("[data-open-folder]");
    if (folderButton) {
      const path = JSON.parse(folderButton.dataset.openFolder);
      state.mode = "folder";
      state.activeTag = path[0];
      state.folderPath = path.slice(1);
      applySearch();
      return;
    }
    const crumb = event.target.closest("[data-crumb]");
    if (crumb) {
      const index = Number(crumb.dataset.crumb);
      if (index === -1) state.folderPath = [];
      else state.folderPath = state.folderPath.slice(0, index + 1);
      applySearch();
    }
  });
  searchInput.addEventListener("input", () => {
    state.query = searchInput.value;
    applySearch();
  });

  loadData();
})();
</script>
</body>
</html>
